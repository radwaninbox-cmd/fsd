<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FSD والشادر</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2E8D5;--surface:#FFFBF2;--ink:#11402E;--accent:#1E6B4B;--hi:#D4A24C;--on:#fff;--line:#e2d5b8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-mode="ship"]{--bg:#0B1530;--surface:#13203f;--ink:#f4f6fb;--accent:#F77F00;--hi:#F77F00;--line:#27386a}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;font-family:Cairo,Tahoma,sans-serif;background:var(--bg);color:var(--ink);transition:background .4s,color .4s;line-height:1.7}
.wrap{max-width:760px;margin:0 auto;padding:12px 16px 90px}
h1{font-size:1.6rem;margin:.3em 0;font-weight:800}
.sub{opacity:.8;margin:0 0 16px}
.bar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tb{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:9px 4px;font:inherit;font-weight:600;font-size:.95rem;cursor:pointer}
.tb[aria-expanded="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--surface))}
.pop{margin-top:8px;border:1.5px solid var(--accent);background:var(--surface);border-radius:16px;padding:12px}
.cr{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.cr:last-child{border:0}.cr b{flex:1}.cr span{direction:ltr;opacity:.85}
.cr a{text-decoration:none;font-size:1.3rem}
.lg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.mode{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:20px;padding:12px;cursor:pointer;font:inherit;text-align:center;transition:.25s}
.mode img{width:100%;max-width:130px;height:100px;object-fit:contain;border-radius:14px}
.mode b{display:block;font-size:1.05rem;margin-top:4px}
.mode small{opacity:.7}
.mode[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}
.sec{margin-top:20px}
.sec>h2{font-size:1.2rem;margin:0 0 10px}
.mc{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;margin-bottom:10px;overflow:hidden}
.mh{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;padding:8px 12px;cursor:pointer}
.mh:focus-visible{outline:3px solid var(--hi)}
.mh img{width:76px;height:64px;object-fit:contain;background:#FFFBF2;border-radius:12px;border:1px solid var(--line)}
.mh b{flex:1;font-size:1.05rem}
.mh i{font-style:normal;transition:.2s}
.mh[aria-expanded="true"] i{transform:rotate(180deg)}
.mb{padding:4px 12px 12px}
.mb h4{margin:10px 0 6px;color:var(--accent)}
.its{display:grid;grid-template-columns:1fr 1fr;gap:6px}
@media(max-width:420px){.its{grid-template-columns:1fr}}
.it{display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--bg);border-radius:12px;padding:5px 10px;font-size:.92rem}
.q{display:flex;align-items:center;gap:6px;flex:none}
.q button{width:28px;height:28px;border-radius:50%;border:0;background:var(--accent);color:var(--on);font:inherit;font-weight:800;cursor:pointer}
.q b{min-width:18px;text-align:center}
form{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px}
fieldset{border:0;padding:0;margin:0 0 20px}
legend{font-weight:800;font-size:1.1rem;margin-bottom:10px;padding:0}
label.f{display:block;font-weight:600;margin-bottom:12px}
label.f span{font-weight:400;opacity:.7}
input[type=text],input[type=tel],input[type=email],select,textarea{display:block;width:100%;margin-top:4px;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.row{grid-template-columns:1fr}}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cat{position:relative}
.cat input{position:absolute;opacity:0;inset:0;cursor:pointer}
.cat div{border:2px solid var(--line);background:var(--bg);border-radius:16px;padding:12px 4px;text-align:center;font-size:.9rem;font-weight:600;transition:.2s}
.cat div i{display:block;font-style:normal;font-size:1.8rem}
.cat input:checked+div{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--bg))}
.cat input:focus-visible+div{outline:3px solid var(--hi)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fav{border:2px dashed var(--hi);border-radius:16px;padding:12px;margin-bottom:14px}
.chk{display:flex;gap:8px;align-items:center;font-weight:600;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
a.tb{display:block;text-align:center;text-decoration:none}
.req{color:#e74c3c;margin-inline-start:6px;font-size:.8rem;font-weight:600}
.bad{border-color:#e74c3c!important;background:color-mix(in srgb,#e74c3c 10%,var(--bg))!important}
.btn{display:inline-block;text-decoration:none;border:0;border-radius:14px;padding:12px 20px;font:inherit;font-weight:800;cursor:pointer;background:var(--accent);color:var(--on)}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--line)}
.go{width:100%;font-size:1.15rem;padding:15px}
.err{color:#e74c3c;font-size:.9rem;display:none;font-weight:600}
.done{display:none;margin-top:22px;border:2px solid var(--accent);border-radius:22px;padding:20px;background:var(--surface)}
.done.show{display:block}
.done pre{white-space:pre-wrap;font:inherit;background:var(--bg);padding:12px;border-radius:12px}
:root[data-mode="market"] .ship-only,:root:not([data-mode="market"]) .mkt-only{display:none!important}
.cartbar{position:fixed;inset-inline:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:736px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--accent);color:var(--on);border-radius:16px;padding:10px 16px;font-weight:800;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:5}
.cartbar button{border:0;border-radius:12px;padding:8px 14px;font:inherit;font-weight:800;background:var(--surface);color:var(--ink);cursor:pointer}
footer{text-align:center;margin-top:28px;font-weight:800;font-size:1.15rem;color:var(--hi)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

function renderMarket(){
  var h="";
  CATS.forEach(function(c,ci){
    var o=!!openCats[ci];
    h+='<div class="mc"><button type="button" class="mh" data-ci="'+ci+'" aria-expanded="'+o+'"><img src="'+IMG[c.img]+'" alt=""><b>'+(lang==="ar"?c.ar:c.en)+'</b><i>▾</i></button><div class="mb"'+(o?"":" hidden")+'>';
    c.gr.forEach(function(g){
      if(c.gr.length>1) h+='<h4>'+(lang==="ar"?g[0]:g[1])+'</h4>';
      h+='<div class="its">';
      g[2].split("،").forEach(function(n){
        h+='<div class="it" data-k="'+ci+'|'+n+'"><span>'+((lang==="en"&&ENI[n])||n)+'</span><span class="q"><button type="button" data-d="-1" aria-label="-">−</button><b>'+(cart[ci+"|"+n]||0)+'</b><button type="button" data-d="1" aria-label="+">+</button></span></div>';
      });
      h+='</div>';
    });
    h+='</div></div>';
  });
  $("mkt").innerHTML=h;
}
$("mkt").addEventListener("click",function(e){
  var hd=e.target.closest(".mh");
  if(hd){var ci=hd.dataset.ci; openCats[ci]=!openCats[ci]; hd.setAttribute("aria-expanded",!!openCats[ci]); hd.nextElementSibling.hidden=!openCats[ci]; return;}
  var bt=e.target.closest("button[data-d]");
  if(bt){
    var it=bt.closest(".it"), k=it.dataset.k, q=Math.max(0,(cart[k]||0)+parseInt(bt.dataset.d,10));
    if(q) cart[k]=q; else delete cart[k];
    it.querySelector("b").textContent=q; updCart();
  }
});
function cartCount(){var n=0;for(var k in cart)n+=cart[k];return n}
function updCart(){var n=cartCount();$("cn").textContent=n;$("cartbar").hidden=!(mode==="market"&&n>0)}
$("gof").addEventListener("click",function(){var y=$("f").getBoundingClientRect().top+(window.pageYOffset||document.documentElement.scrollTop||0)-8;window.scrollTo(0,y);document.documentElement.scrollTop=y;document.body.scrollTop=y;$("f").scrollIntoView();});

function fillSel(id,arr,first){
  var s=$(id), cur=s.value; s.innerHTML=first?'<option value="">'+first+'</option>':"";
  arr.forEach(function(p){var a=p.split("|");var o=document.createElement("option");o.value=a[0];o.textContent=lang==="ar"?a[0]:a[1];s.appendChild(o)});
  if(cur)s.value=cur;
}
function updLg(){$("lg2").textContent=t(mode==="market"?"routeM":"route")}
function updGov(){$("gwrap").hidden=!(mode==="market"||$("country").value==="مصر")}

function applyLang(){
  root.lang=lang; root.dir=lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-i]").forEach(function(e){e.textContent=t(e.dataset.i)});
  document.querySelectorAll("[data-ph]").forEach(function(e){e.placeholder=t(e.dataset.ph)});
  updLg(); fillSel("country",COUNTRIES); fillSel("gov",GOVS,t("govph")); renderFavs(); renderMarket(); updGov();
  document.title=mode==="ship"?"FSD Logistics":"El Shader – الشادر";
  if(!$("pop").hidden) showPop(curPop);
}
function setMode(m){
  mode=m; root.setAttribute("data-mode",m);
  document.querySelectorAll(".mode").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.m===m)});
  document.title=m==="ship"?"FSD Logistics":"El Shader – الشادر"; updGov(); updCart(); updLg();
}
document.querySelectorAll(".mode").forEach(function(b){b.addEventListener("click",function(){setMode(b.dataset.m)})});

// top menu
var curPop="";
function showPop(p){
  var h="";
  if(p==="contact"){
    [["cn1","01063142435","201063142435"],["cn2","01018636318","201018636318"]].forEach(function(c){
      h+='<div class="cr"><b>'+t(c[0])+'</b><span>'+c[1]+'</span><a href="tel:+'+c[2]+'" aria-label="call">📞</a><a href="https://wa.me/'+c[2]+'" target="_blank" rel="noopener" aria-label="WhatsApp">💬</a></div>';
    });
  } else if(p==="support"){
    h='<p style="margin-top:0">'+t("ctxt")+'</p><a class="btn" target="_blank" rel="noopener" href="https://wa.me/'+SUP+'">💬 '+t("sbtn")+'</a> <a class="btn alt" href="tel:+'+SUP+'">📞 01018636318</a>';
  } else {
    h='<div class="lg"><button class="btn'+(lang==="ar"?"":" alt")+'" data-l="ar" type="button">العربية</button><button class="btn'+(lang==="en"?"":" alt")+'" data-l="en" type="button">English</button></div>';
  }
  $("pop").innerHTML=h; $("pop").hidden=false;
}
document.querySelectorAll("button.tb").forEach(function(b){b.addEventListener("click",function(){
  var p=b.dataset.p, same=(curPop===p&&!$("pop").hidden);
  document.querySelectorAll("button.tb").forEach(function(x){x.setAttribute("aria-expanded","false")});
  if(same){$("pop").hidden=true;curPop="";return;}
  curPop=p; b.setAttribute("aria-expanded","true"); showPop(p);
})});
$("pop").addEventListener("click",function(e){var b=e.target.closest("[data-l]");if(b){lang=b.dataset.l;applyLang()}});

// favorites
var FK="fsd_favs", favs=[];
try{favs=JSON.parse(localStorage.getItem(FK)||"[]")}catch(e){}
function saveFavs(){try{localStorage.setItem(FK,JSON.stringify(favs))}catch(e){}}
function renderFavs(){
  var s=$("favsel"); s.innerHTML='<option value="">'+t("newc")+'</option>';
  favs.forEach(function(f,i){var o=document.createElement("option");o.value=i;o.textContent=f.name+" ("+f.n+" "+t("shipments")+")";s.appendChild(o)});
  $("favbox").hidden=!favs.length;
}
$("favsel").addEventListener("change",function(){
  var f=favs[this.value]; if(!f) return;
  $("name").value=f.name;$("phone").value=f.phone;$("email").value=f.email||"";$("addr").value=f.addr;
});
$("country").addEventListener("change",updGov);
["name","phone","addr","rname","rphone","raddr","gov"].forEach(function(i){$(i).addEventListener("input",function(){this.classList.remove("bad")})});

var lastText="";
$("f").addEventListener("submit",function(e){
  e.preventDefault();
  var need=mode==="ship"?["name","phone","addr","rname","rphone","raddr"]:["rname","rphone","raddr"];
  var ok=true, first=null;
  need.forEach(function(i){
    var v=$(i).value.trim(), bad=!v;
    if((i==="phone"||i==="rphone")&&v&&v.replace(/\D/g,"").length<8) bad=true;
    $(i).classList.toggle("bad",bad);
    if(bad){ok=false;if(!first)first=$(i)}
  });
  if(!$("gwrap").hidden){var gb=!$("gov").value;$("gov").classList.toggle("bad",gb);if(gb){ok=false;if(!first)first=$("gov")}}
  var msg=t("err");
  if(ok&&mode==="market"&&!cartCount()){ok=false;msg=t("errCart");}
  $("err").textContent=msg; $("err").style.display=ok?"none":"block";
  if(!ok){ if(first) first.focus(); return; }

  var oid=(mode==="ship"?"FSD-":"SHD-")+Math.floor(100000+Math.random()*900000);
  var fav=null;
  if(mode==="ship"&&($("savefav").checked||$("favsel").value!=="")){
    var ph=$("phone").value.trim();
    fav=favs.filter(function(f){return f.phone===ph})[0];
    if(!fav){fav={n:0};favs.push(fav)}
    fav.name=$("name").value.trim();fav.phone=ph;fav.email=$("email").value.trim();fav.addr=$("addr").value.trim();fav.n++;
    saveFavs();renderFavs();
  }
  var fr=document.querySelector("input[name=frag]:checked").value;
  var lines=[
    "نوع الطلب: "+(mode==="ship"?"شحن (FSD Logistics)":"ماركت الشادر"),
    mode==="ship"?"اسم الراسل: "+$("name").value.trim():null,
    fav?"⭐ عميل مميز (طلب رقم "+fav.n+")":null,
    mode==="ship"?"موبايل الراسل: "+$("phone").value.trim():null,
    mode==="ship"&&$("email").value.trim()?"البريد: "+$("email").value.trim():null,
    mode==="ship"?"عنوان الراسل: "+$("addr").value.trim():null,
    (mode==="ship"?"المستلم: ":"اسم المستلم: ")+$("rname").value.trim(),
    "موبايل المستلم: "+$("rphone").value.trim(),
    "الدولة: "+(mode==="ship"?$("country").value:"مصر"),
    $("gwrap").hidden?null:"المحافظة: "+$("gov").value,
    "عنوان التسليم: "+$("raddr").value.trim(),
    mode==="ship"?"المحتوى: "+document.querySelector("input[name=cat]:checked").value:null,
    "الحالة: "+fr,
    $("note").value.trim()?"ملاحظات: "+$("note").value.trim():null
  ].filter(Boolean);
  if(mode==="market"){
    lines.push("الأصناف المطلوبة:");
    for(var k in cart) lines.push("• "+k.split("|")[1]+" × "+cart[k]);
  }
  lastText="طلب جديد "+oid+"\n"+lines.join("\n");
  $("oid").textContent=oid; $("sum").textContent=lines.join("\n");
  $("wa").href="https://wa.me/"+NUM+"?text="+encodeURIComponent(lastText);
  $("done").classList.add("show"); $("done").scrollIntoView({behavior:"smooth"});
  $("wa").click();
});
$("again").addEventListener("click",function(){
  $("f").reset(); cart={}; renderMarket(); updCart(); updGov();
  $("done").classList.remove("show"); window.scrollTo({top:0,behavior:"smooth"});
});

setMode("ship"); applyLang();
</script>
</body>
</html>
